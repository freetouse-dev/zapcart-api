[project]
name = "zapcart-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ajayraj", email = "ajayraj.b@mitrahsoft.in" }
]
requires-python = ">=3.13.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.4",
    "psycopg>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
zapcart = "zapcart_api.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
