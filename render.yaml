services:
  - type: web
    name: zapcart-api
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_TIME
        value: 30
      - key: DATABASE_URL
        fromDatabase:
          name: zapcart-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: zapcart-redis
          property: connectionString

databases:
  - name: zapcart-db
    plan: free
    region: oregon

redis:
  - name: zapcart-redis
    plan: free
    region: oregon
    ipAllowList: []
